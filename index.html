                        <p style="line-height: 1.6; margin-left: 20px;">If you cleared Safari data or deleted the app, your cases are gone. There's no cloud backup. Going forward, don't clear Safari website data.</p>
                        
                        <p style="line-height: 1.6; margin: 16px 0 12px;"><strong>App not working?</strong></p>
                        <p style="line-height: 1.6; margin-left: 20px;">Close Safari completely and reopen the file. If issues persist, delete from home screen and re-add.</p>
                    </div>

                    <div class="card">
                        <h3 style="margin-bottom: 12px;">📞 Questions?</h3>
                        <p style="line-height: 1.6;">This tracker was custom-built for anesthesiologists using the UCP compensation model. Contact the person who shared this with you for questions about UCP point calculations.</p>
                    </div>
                </div>
            `;
        }

        function exportToCSV() {
            if (allCases.length === 0) {
                alert('No data to export. Please log some cases first.');
                return;
            }

            try {
                // Export full JSON data as CSV for complete reimport capability
                const headers = ['Date', 'Mode', 'Points', 'FullData'];
                
                // Generate rows with full data encoded
                const rows = allCases.map(c => {
                    return [
                        c.date,
                        c.mode,
                        c.points.toFixed(2),
                        '"' + JSON.stringify(c).replace(/"/g, '""') + '"'
                    ].join(',');
                });

                // Create CSV
                const csv = [headers.join(','), ...rows].join('\n');
                
                // Create download
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ucp-points-' + new Date().toISOString().split('T')[0] + '.csv';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert('Exported ' + allCases.length + ' entries to CSV');
                
            } catch (error) {
                alert('Export error: ' + error.message);
            }
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const lines = content.split('\n');
                    
                    // Skip header
                    const dataLines = lines.slice(1).filter(line => line.trim());
                    
                    const importedCases = [];
                    let parseErrors = 0;
                    
                    dataLines.forEach(line => {
                        try {
                            // Parse CSV line (handle quoted JSON)
                            const match = line.match(/^([^,]+),([^,]+),([^,]+),"(.+)"$/);
                            if (match) {
                                const jsonStr = match[4].replace(/""/g, '"');
                                const caseData = JSON.parse(jsonStr);
                                importedCases.push(caseData);
                            }
                        } catch (err) {
                            parseErrors++;
                        }
                    });

                    if (importedCases.length === 0) {
                        alert('No valid data found in CSV file');
                        return;
                    }

                    // Smart merge: detect duplicates
                    const existingIds = new Set(allCases.map(c => c.id));
                    const newCases = importedCases.filter(c => !existingIds.has(c.id));
                    const duplicates = importedCases.length - newCases.length;

                    if (newCases.length === 0) {
                        alert('All ' + importedCases.length + ' cases already exist. Nothing to import.');
                        return;
                    }

                    // Confirm import
                    const msg = 'Found ' + importedCases.length + ' cases in file:\n\n' +
                                '✅ ' + newCases.length + ' new cases to import\n' +
                                '⚠️ ' + duplicates + ' duplicates (will be skipped)\n' +
                                (parseErrors > 0 ? '❌ ' + parseErrors + ' errors (will be skipped)\n' : '') +
                                '\nImport new cases?';
                    
                    if (confirm(msg)) {
                        allCases.push(...newCases);
                        saveCases();
                        render();
                        alert('✅ Successfully imported ' + newCases.length + ' cases!');
                    }

                } catch (error) {
                    alert('Import error: ' + error.message);
                }
                
                // Clear file input
                event.target.value = '';
            };
            
            reader.readAsText(file);
        }

        function getModeLabel(mode) {
            const labels = {
                'phd-supervise': 'Daily Cases',
                'partial-day': 'Partial Day',
                'pga-br': 'PGA BR',
                'pga-ob': 'PGA OB',
                'phd-trauma': 'PHD Trauma',
                'low-census': 'Low Census',
                'flat-fee': 'Flat Fee'
            };
            return labels[mode] || mode;
        }

        function deleteCase(id) {
            if (confirm('Delete this entry?')) {
                allCases = allCases.filter(c => c.id !== id);
                saveCases();
                render();
            }
        }
    </script>
